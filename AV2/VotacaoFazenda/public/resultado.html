
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado - A Fazenda 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-md navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img/logo-fazenda.jpg" alt="logo galinha" height="45">
                <span>A Fazenda 2026</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="votacao.html">Votar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="resultado.html">Resultado</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">

        <h1 class="text-center mb-4">Resultado da votação</h1>

        <div class="alert alert-info">
            Total de votos: <strong id="totalVotos">0</strong>
        </div>

        <div id="mensagem"></div>

        <div id="placar"></div>

        <div class="text-center mt-4">
            <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalZerar">
                Zerar votação
            </button>
        </div>

    </main>

    <div class="modal fade" id="modalZerar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Zerar votação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    Tem certeza que deseja apagar todos os votos?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" class="btn btn-danger" id="confirmarZerar">
                        Confirmar
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>

    <script>
        async function carregarResultado() {
            const participantes = await buscarParticipantes(true);
            const votos = await buscarVotos();

            document.getElementById("totalVotos").textContent = votos.length;

            const placar = document.getElementById("placar");
            const mensagem = document.getElementById("mensagem");

            placar.innerHTML = "";
            mensagem.innerHTML = "";

            if (votos.length === 0) {
                mensagem.innerHTML = `
                    <div class="alert alert-warning text-center">
                        Ainda não existem votos. Participe da votação!
                    </div>
                `;
                return;
            }

            const resultados = participantes.map(participante => {
                const quantidade = votos.filter(voto =>
                    Number(voto.participanteId) === Number(participante.id)
                ).length;

                const percentual = (quantidade / votos.length) * 100;

                return {
                    ...participante,
                    quantidade,
                    percentual
                };
            });

            resultados.sort((a, b) => b.quantidade - a.quantidade);

            resultados.forEach((participante, index) => {
                placar.innerHTML += `
                    <div class="card mb-4">
                        <div class="card-body">

                            <div class="d-flex align-items-center gap-3 mb-3">

                                <img src="${participante.foto}"
                                    width="100"
                                    height="100"
                                    class="rounded"
                                    alt="${participante.nome}"
                                    style="object-fit: cover;">

                                <div>
                                    <h5>${participante.nome}</h5>

                                    ${index === 0 ? `
                                        <span class="badge bg-danger">Sairia hoje</span>
                                    ` : ""}
                                </div>

                            </div>

                            <div class="d-flex justify-content-between mb-2">
                                <span>${participante.quantidade} votos</span>
                                <strong>${participante.percentual.toFixed(1)}%</strong>
                            </div>

                            <div class="progress">
                                <div class="progress-bar"
                                    role="progressbar"
                                    style="width: ${participante.percentual}%"
                                    aria-valuenow="${participante.percentual}"
                                    aria-valuemin="0"
                                    aria-valuemax="100">
                                </div>
                            </div>

                        </div>
                    </div>
                `;
            });
        }

        document.getElementById("confirmarZerar").addEventListener("click", async function() {
            const votos = await buscarVotos();

            await Promise.all(
                votos.map(voto => excluirVoto(voto.id))
            );

            const modal = bootstrap.Modal.getInstance(
                document.getElementById("modalZerar")
            );

            modal.hide();

            await carregarResultado();
        });

        carregarResultado();
    </script>

</body>
</html>
